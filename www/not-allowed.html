<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; gap: 16px; text-align: center; }
    h1 { font-size: 1.5rem; }
    p { opacity: 0.5; font-size: 0.95rem; }
    a { color: #ff453a; font-size: 0.85rem; opacity: 0.6; text-decoration: none; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Access Denied</h1>
  <p>Your account is not authorised to view this page.</p>
  <a href="/oauth2/sign_out">Sign out</a>
</body>
</html>
